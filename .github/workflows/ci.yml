name: CI

# Continuous integration for the data pipeline:
#   - runs the unit test suite (validation / transformation / load)
#   - runs the full ETL pipeline end-to-end on SQLite to prove it works
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest

      - name: Run the full pipeline (SQLite)
        run: python pipeline.py --generate 20000 --sqlite

      - name: Show data-quality report
        run: cat data/quality/quality_report.md

      - name: Upload quality report as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: data/quality/quality_report.md
