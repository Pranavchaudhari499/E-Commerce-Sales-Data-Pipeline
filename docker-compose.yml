# ============================================================================
# E-commerce Analytics — full stack (PostgreSQL production deployment)
# ----------------------------------------------------------------------------
#   docker compose up --build
#
# Services:
#   db        - PostgreSQL database (holds the star schema + analytics)
#   etl       - runs the ETL pipeline once on startup (idempotent)
#   dashboard - running too: a small helper that waits for the DB, loads data
#               via the pipeline, then serves the Dash dashboard on :8050
#
# The ETL is deliberately a short-lived job. Run `docker compose run --rm etl`
# anytime to refresh the data.
# ============================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build: .
    # One-shot ETL job against the database.
    command: ["python", "pipeline.py", "--postgresql"]
    environment:
      DB_ENGINE: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data   # persist raw/quality outputs to the host

  dashboard:
    build: .
    # Ensure data is loaded, then serve the dashboard.
    command: >
      sh -c "python pipeline.py --postgresql && python dashboard/app.py 8050"
    environment:
      DB_ENGINE: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
    ports:
      - "8050:8050"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
